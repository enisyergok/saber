name: Check

# Fast feedback for work-in-progress branches: static analysis plus
# rendered screenshots of the main screens. The APK is only built from main.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "check-results*"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and render screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: flutter pub get

      - name: Static analysis
        if: false
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Download fonts used by golden tests
        continue-on-error: true
        run: dart run golden_screenshot:download_apple_fonts

      - name: Probe tests
        run: |
          timeout 240 flutter test --no-pub --reporter expanded test/image_crop_test.dart > p1.txt 2>&1 || true
                    timeout 420 flutter test --no-pub --reporter expanded test/image_actions_test.dart > p2.txt 2>&1 || true
          
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          results="$RUNNER_TEMP/check-results"
          mkdir -p "$results"
          tail -n 80 p1.txt > "$results/p1.txt" || true
          tail -n 120 p2.txt > "$results/p2.txt" || true
          echo "$GITHUB_SHA" > "$results/commit.txt"
          cd "$results"
          branch="check-results-${GITHUB_REF_NAME//\//-}"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "probe results"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
