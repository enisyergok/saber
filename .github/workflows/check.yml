name: Check

# Fast feedback for work-in-progress branches: static analysis plus
# rendered screenshots of the main screens. The APK is only built from main.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "check-results*"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and render screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: flutter pub get

      - name: Static analysis
        if: false
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Download fonts used by golden tests
        continue-on-error: true
        run: dart run golden_screenshot:download_apple_fonts

      - name: Probe tests
        run: |
          timeout 240 flutter test --no-pub --reporter expanded test/image_crop_test.dart 2>&1 | tail -n 40 || true
          echo ===== actions
          timeout 420 flutter test --no-pub --reporter expanded test/image_actions_test.dart 2>&1 | tail -n 60 || true
          echo ===== done
