name: Check

# Fast feedback for work-in-progress branches: static analysis plus
# rendered screenshots of the main screens. The APK is only built from main.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and render screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: flutter pub get

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Render screenshots
        id: screenshots
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub --update-goldens test/defter_screens_test.dart 2>&1 | tee screenshots.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-results
          path: |
            analyze.txt
            screenshots.txt
            test/defter_shots/
          if-no-files-found: warn

      - name: Fail if a step failed
        if: steps.analyze.outcome == 'failure' || steps.screenshots.outcome == 'failure'
        run: exit 1
