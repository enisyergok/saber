name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      # Without these secrets the build falls back to android/fallback-key.jks,
      # which is the same on every run, so updates still install over each other.
      - name: Setup keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/android.keystore
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=../android.keystore"
          } > android/key.properties

      - name: Setup Android build tools
        run: |
          ANDROID_NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV

          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> $GITHUB_ENV

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - name: Build apk
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          baseBuildNumber=$(grep -oP "(?<=buildNumber = )\d+" lib/data/version.dart)
          flutter build apk \
            --target-platform android-arm64 \
            --build-number=$((baseBuildNumber + RUN_NUMBER)) \
            --dart-define=UPDATE_CHECK="false" \
            --dart-define=CI_BUILD="${RUN_NUMBER}" 2>&1 | tee build-log.txt

      # A failed build leaves its log on an orphan branch, so it can be read
      # with plain git (the job logs themselves need a browser).
      - name: Publish the log of a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          results="$RUNNER_TEMP/build-results"
          mkdir -p "$results"
          tail -n 400 build-log.txt > "$results/build-log.txt" 2>/dev/null || true
          {
            echo "commit: $GITHUB_SHA"
            echo "ANDROID_NDK=$ANDROID_NDK"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "-- ndk:"; ls /usr/local/lib/android/sdk/ndk 2>&1
            echo "-- java:"; env | grep -E '^JAVA_HOME_' | sort
            echo "-- image: $ImageOS $ImageVersion"
          } > "$results/environment.txt"
          cd "$results"
          git init -q -b build-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build log for $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-results

      - name: Rename apk
        id: rename_apk
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          apkName="Marj_b${RUN_NUMBER}.apk"
          echo "apkName=$apkName" >> $GITHUB_OUTPUT
          mkdir -p output
          mv build/app/outputs/flutter-apk/app-release.apk "output/$apkName"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Marj-Android
          path: output/${{ steps.rename_apk.outputs.apkName }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          APK: output/${{ steps.rename_apk.outputs.apkName }}
        run: |
          gh release create "build-${RUN_NUMBER}" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Marj build ${RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA}" \
            --latest
