<svg
    xmlns="http://www.w3.org/2000/svg"
    width="595" height="842" preserveAspectRatio="none"
>
    <defs>
        <pattern id="pattern" width="100%" height="16" patternUnits="userSpaceOnUse">
            <rect id="primitive" class="gnForegroundFill" y="15.5" width="100%" height="0.5" fill="#D0D2D3"/>
        </pattern>
    <style type="text/css"><![CDATA[
.gnBackground {
  fill: #FFFFFF;
}

.gnForegroundFill {
  fill: #D0D2D3;
}

.gnAccentFill {
  fill: #333333;
}

]]></style>
</defs>

    <rect class="gnBackground" width="100%" height="100%" fill="#F8F7E9"/>
    <rect id="patternRect" y="34.5" width="100%" height="80%" fill="url(#pattern)"/>
    <g class="gnAccentFill" fill="#333333">
        <rect width="100%" height="0.5" y="82"/>
        <rect id="verticalLine" width="0.5" x="20%" y="82"/>
        <rect id="bottomLine" width="100%" height="0.5"/>
    </g>

    <rect id="gn-typing-1" data-line-height="15.5" data-line-spacing="0.5" data-header-style="paragraph" x="20%" y="82" width="80%" height="80%" fill="none"/>
    <rect id="gn-typing-2" data-line-height="15.5" data-line-spacing="0.5" x="24" y="34.5" width="100%" height="80%" fill="none"/>
    <rect id="gn-typing-3" data-line-height="15.5" data-line-spacing="0.5" x="24" y="82" width="100%" height="80%" fill="none"/>
    <rect id="gn-typing-4" data-line-height="15.5" data-line-spacing="0.5" x="24" y="80%" width="100%" height="80%" fill="none"/>
</svg>
