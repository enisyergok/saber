<svg
    xmlns="http://www.w3.org/2000/svg"
    width="100%" height="100%"
>
    <defs>
        <pattern id="horizontalLines" width="100%" height="16" patternUnits="userSpaceOnUse">
            <rect width="100%" height="0.5" y="8" fill="rgb(208,210,211)"/>
        </pattern>
        <pattern id="verticalLines" width="16" height="100%" patternUnits="userSpaceOnUse">
            <rect height="100%" width="0.5" x="8" fill="rgb(208,210,211)"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="rgb(247,246,233)"/>
    <rect id="horizontalLinesRect" width="100%" height="100%" fill="url(#horizontalLines)"/>
    <rect id="verticalLinesRect" width="100%" height="100%" fill="url(#verticalLines)"/>
</svg>
