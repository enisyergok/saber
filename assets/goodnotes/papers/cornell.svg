<svg
    xmlns="http://www.w3.org/2000/svg"
    width="100%" height="100%"
>
    <defs>
        <pattern id="pattern" width="100%" height="16" patternUnits="userSpaceOnUse">
            <rect id="primitive" width="100%" height="0.5" fill="rgb(208,210,211)"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="rgb(247,246,233)"/>
    <rect id="patternRect" y="50" width="100%" height="90%" fill="url(#pattern)"/>

    <g fill="rgb(34,31,31)">
        <rect width="100%" height="0.5" y="82"/>
        <rect id="verticalLine" width="0.5" x="30%" y="82"/>
        <rect id="bottomLine" width="100%" height="0.5"/>
    </g>
</svg>
